name: Deploy to GitHub Pages

on:
  # Rebuild every day at 00:30 UTC with a fresh ETF snapshot
  schedule:
    - cron: "30 0 * * *"
  # Rebuild on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Serialize deploys so a scheduled run and a push don't race
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Pull the latest ETF data and bundle it into the build
      - run: bun run fetch:etfs

      - run: bun run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
